name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests (zero dependencies, nothing to install)
        run: node --test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No JWT-like strings outside the redaction fixtures
        run: |
          # Token-shaped only (eyJ + 8 base64url chars): prose mentions of
          # the bare eyJ prefix are fine; the redaction code and its test
          # fixtures are the only files allowed to contain shaped fakes.
          hits=$(grep -rnE "eyJ[A-Za-z0-9_-]{8,}" --exclude-dir=.git . | grep -vE '^(\./)?(worker/redact\.js|test/redact\.test\.js):' || true)
          if [ -n "$hits" ]; then echo "$hits"; exit 1; fi
      - name: ASCII-only committed files
        run: |
          hits=$(LC_ALL=C grep -rlP '[^\x00-\x7F]' --exclude-dir=.git . || true)
          if [ -n "$hits" ]; then echo "non-ASCII found in:"; echo "$hits"; exit 1; fi
